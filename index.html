<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>KonPlay - YouTube No-Ads Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 3px; }
        
        .ratio-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }
        .ratio-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        /* Phóng to toàn màn hình rạp phim */
        .cinema-mode .main-grid {
            grid-template-columns: 1fr !important;
        }
        .cinema-mode .ratio-box {
            max-height: 75vh;
            padding-bottom: 42%;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- HEADER -->
    <header class="flex items-center justify-between px-6 py-3 bg-[#0f0f0f] border-b border-[#272727] h-16 flex-shrink-0 z-50">
        <div class="flex items-center gap-2 cursor-pointer" onclick="loadVideo('jfKfPfyJRdk', 'Học Cùng Tôi #12 | Coding Lofi Beats [No Ads]')">
            <i class="fa-brands fa-youtube text-red-600 text-3xl"></i>
            <span class="font-bold text-xl tracking-tighter text-white">Trung<span class="text-red-500">Play</span></span>
        </div>

        <!-- SEARCH BAR & VOICE -->
        <div class="flex items-center w-full max-w-xl mx-4">
            <div class="flex w-full items-center bg-[#121212] border border-[#303030] rounded-full overflow-hidden focus-within:border-blue-500">
                <input id="searchInput" type="text" placeholder="Tìm kiếm hoặc dán URL YouTube..." 
                       class="w-full bg-transparent px-4 py-2 text-sm text-white focus:outline-none"
                       onkeypress="if(event.key === 'Enter') handleSearch()">
                <button onclick="handleSearch()" class="bg-[#222222] hover:bg-[#303030] px-5 py-2 border-l border-[#303030] text-gray-300">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button id="micBtn" onclick="startVoiceSearch()" class="ml-2 p-2.5 bg-[#222222] hover:bg-[#303030] rounded-full text-white flex-shrink-0" title="Tìm kiếm giọng nói">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="switchTab('home')" id="tabHome" class="px-3 py-1.5 rounded-full text-sm font-medium bg-[#272727] text-white">Khám phá</button>
            <button onclick="switchTab('library')" id="tabLib" class="px-3 py-1.5 rounded-full text-sm font-medium hover:bg-[#272727] text-gray-300">Thư viện</button>
        </div>
    </header>

    <!-- BODY -->
    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 overflow-y-auto p-6">
            
            <!-- HOME VIEW -->
            <div id="homeView" class="max-w-7xl mx-auto main-grid grid grid-cols-1 lg:grid-cols-3 gap-6 transition-all duration-300">
                
                <!-- Main Player & Details (2 columns default, 1 column in cinema mode) -->
                <div class="lg:col-span-2 flex flex-col gap-4">
                    
                    <!-- Khung phát video kèm thanh công cụ phóng to/thu nhỏ -->
                    <div class="relative group">
                        <div id="playerContainer" class="ratio-box shadow-2xl">
                            <iframe id="youtubeIframe" 
                                    src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1&enablejsapi=1" 
                                    title="YouTube Player" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen>
                            </iframe>
                        </div>

                        <!-- Các nút điều chỉnh kích thước nổi trên video (giống YouTube) -->
                        <div class="absolute top-3 right-3 flex items-center gap-2 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="toggleCinemaMode()" class="text-white hover:text-red-500 text-xs flex items-center gap-1" title="Chế độ Rạp phim">
                                <i class="fa-solid fa-expand"></i> Rạp phim
                            </button>
                            <span class="text-gray-500">|</span>
                            <button onclick="toggleFitScreen()" class="text-white hover:text-red-500 text-xs flex items-center gap-1" title="Thu nhỏ / Phóng to">
                                <i class="fa-solid fa-compress" id="fitIcon"></i> Thu phóng
                            </button>
                        </div>
                    </div>

                    <h1 id="videoTitle" class="text-xl font-bold text-white">Học Cùng Tôi #12 | Coding Lofi Beats [No Ads]</h1>

                    <div class="flex items-center justify-between bg-[#1f1f1f] p-4 rounded-xl border border-[#272727]">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center font-bold text-white">TP</div>
                            <div>
                                <h3 class="font-semibold text-white text-sm">TrungPlay Official</h3>
                                <p class="text-xs text-gray-400">Không quảng cáo • Trải nghiệm Premium</p>
                            </div>
                        </div>
                        <button onclick="saveToFavorites()" class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded-full font-medium flex items-center gap-2">
                            <i class="fa-solid fa-heart"></i> Lưu Yêu Thích
                        </button>
                    </div>
                </div>

                <!-- Recommendations Sidebar -->
                <div id="sidebarCol" class="flex flex-col gap-3">
                    <h2 class="font-bold text-lg text-white mb-2">Video đề xuất từ YouTube</h2>
                    <div id="recommendationsList" class="flex flex-col gap-3">
                        <!-- Rendered dynamically -->
                    </div>
                </div>

            </div>

            <!-- LIBRARY VIEW -->
            <div id="libraryView" class="max-w-5xl mx-auto hidden flex flex-col gap-6">
                <h2 class="text-2xl font-bold text-white">Danh sách yêu thích của bạn</h2>
                <div id="favoritesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Rendered from LocalStorage -->
                </div>
            </div>

        </main>
    </div>

    <!-- SCRIPT -->
    <script>
        const youtubeSuggestions = [
            { id: 'jfKfPfyJRdk', title: 'Học Cùng Tôi #12 | Coding Lofi Beats', channel: 'CodeChill', duration: 'Live' },
            { id: '5qap5aO4i9A', title: 'lofi hip hop radio - beats to study/relax to', channel: 'Lofi Girl', duration: 'Live' },
            { id: 'SqcY0GlETPk', title: 'React JS Tutorial for Beginners', channel: 'Programming with Mosh', duration: '12:45' },
            { id: '4xDzrJKXOOY', title: 'Anime Lofi Hip Hop Mix - Chill Study Beats', channel: 'ChilledCow', duration: '1:15:00' },
            { id: 'DWcJFNfaw9c', title: 'Lofi Piano Music for Studying and Sleeping', channel: 'Relaxing Station', duration: '3:00:00' }
        ];

        let currentVideo = youtubeSuggestions[0];
        let isCinema = false;
        let isSmall = false;

        window.onload = function() {
            renderRecommendations();
            loadVideo(currentVideo.id, currentVideo.title);
        };

        function renderRecommendations() {
            const container = document.getElementById('recommendationsList');
            container.innerHTML = youtubeSuggestions.map(v => `
                <div onclick="loadVideo('${v.id}', '${v.title}')" class="flex gap-3 cursor-pointer group p-2 rounded-xl hover:bg-[#272727] transition">
                    <div class="relative w-36 h-20 flex-shrink-0 bg-gray-800 rounded-lg overflow-hidden">
                        <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" class="w-full h-full object-cover group-hover:scale-105 transition">
                        <span class="absolute bottom-1 right-1 bg-black/80 text-[10px] px-1 rounded text-white">${v.duration}</span>
                    </div>
                    <div class="flex flex-col justify-center gap-1">
                        <h4 class="text-sm font-semibold text-white line-clamp-2 leading-snug group-hover:text-blue-400">${v.title}</h4>
                        <p class="text-xs text-gray-400">${v.channel}</p>
                    </div>
                </div>
            `).join('');
        }

        function extractVideoId(urlOrId) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId;
        }

        function loadVideo(idOrUrl, title) {
            const id = extractVideoId(idOrUrl);
            document.getElementById('youtubeIframe').src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1`;
            if(title) {
                document.getElementById('videoTitle').innerText = title;
                currentVideo = { id, title };
            }
            saveHistory(currentVideo);
        }

        // Tính năng Phóng to Rạp phim (Cinema Mode)
        function toggleCinemaMode() {
            isCinema = !isCinema;
            const homeView = document.getElementById('homeView');
            const sidebar = document.getElementById('sidebarCol');
            
            if(isCinema) {
                homeView.classList.add('cinema-mode');
                sidebar.style.display = 'none';
            } else {
                homeView.classList.remove('cinema-mode');
                sidebar.style.display = 'flex';
            }
        }

        // Tính năng Thu nhỏ / Phóng to Khung phát (Miniplayer style)
        function toggleFitScreen() {
            isSmall = !isSmall;
            const playerContainer = document.getElementById('playerContainer');
            const fitIcon = document.getElementById('fitIcon');

            if(isSmall) {
                playerContainer.style.maxWidth = '600px';
                playerContainer.style.margin = '0 auto';
                fitIcon.className = "fa-solid fa-expand";
            } else {
                playerContainer.style.maxWidth = '100%';
                playerContainer.style.margin = '0';
                fitIcon.className = "fa-solid fa-compress";
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(query) {
                loadVideo(query, `Kết quả tìm kiếm: ${query}`);
            }
        }

        // Voice Search
        function startVoiceSearch() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Trình duyệt không hỗ trợ tìm kiếm giọng nói.");
                return;
            }
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'vi-VN';
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('bg-red-600', 'animate-pulse');

            recognition.onresult = function(e) {
                const text = e.results[0][0].transcript;
                document.getElementById('searchInput').value = text;
                handleSearch();
                micBtn.classList.remove('bg-red-600', 'animate-pulse');
            };
            recognition.onerror = recognition.onend = () => micBtn.classList.remove('bg-red-600', 'animate-pulse');
            recognition.start();
        }

        // LocalStorage Management
        function saveHistory(video) {
            let history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            history = history.filter(v => v.id !== video.id);
            history.unshift(video);
            localStorage.setItem('yt_history', JSON.stringify(history));
        }

        function saveToFavorites() {
            let favs = JSON.parse(localStorage.getItem('yt_favorites') || '[]');
            if(!favs.some(v => v.id === currentVideo.id)) {
                favs.unshift(currentVideo);
                localStorage.setItem('yt_favorites', JSON.stringify(favs));
                alert('Đã lưu vào danh sách yêu thích!');
            } else {
                alert('Video đã có trong thư viện yêu thích.');
            }
        }

        function switchTab(tab) {
            const home = document.getElementById('homeView');
            const lib = document.getElementById('libraryView');
            const tHome = document.getElementById('tabHome');
            const tLib = document.getElementById('tabLib');

            if(tab === 'home') {
                home.classList.remove('hidden');
                lib.classList.add('hidden');
                tHome.className = "px-3 py-1.5 rounded-full text-sm font-medium bg-[#272727] text-white";
                tLib.className = "px-3 py-1.5 rounded-full text-sm font-medium hover:bg-[#272727] text-gray-300";
            } else {
                home.classList.add('hidden');
                lib.classList.remove('hidden');
                tLib.className = "px-3 py-1.5 rounded-full text-sm font-medium bg-[#272727] text-white";
                tHome.className = "px-3 py-1.5 rounded-full text-sm font-medium hover:bg-[#272727] text-gray-300";
                renderLibrary();
            }
        }

        function renderLibrary() {
            const favs = JSON.parse(localStorage.getItem('yt_favorites') || '[]');
            document.getElementById('favoritesContainer').innerHTML = favs.length ? favs.map(v => `
                <div onclick="loadVideo('${v.id}', '${v.title}'); switchTab('home');" class="bg-[#1f1f1f] rounded-xl overflow-hidden cursor-pointer hover:bg-[#2a2a2a] transition border border-[#272727] p-2 flex gap-3">
                    <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" class="w-24 h-16 object-cover rounded-lg">
                    <div class="flex flex-col justify-center">
                        <h4 class="text-sm font-semibold text-white line-clamp-2">${v.title}</h4>
                    </div>
                </div>
            `).join('') : '<p class="text-gray-500 text-sm">Chưa có video yêu thích nào.</p>';
        }
    </script>
</body>
</html>
