<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>YouTube No-Ads Premium Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            font-family: 'Roboto', sans-serif;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 3px; }
        .ratio-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
        }
        .ratio-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- HEADER BAR -->
    <header class="flex items-center justify-between px-6 py-3 bg-[#0f0f0f] border-b border-[#272727] h-16 flex-shrink-0">
        <div class="flex items-center gap-2 cursor-pointer" onclick="loadDefaultVideo()">
            <i class="fa-brands fa-youtube text-red-600 text-3xl"></i>
            <span class="font-bold text-xl tracking-tighter text-white">NoAds<span class="text-red-500">Premium</span></span>
        </div>

        <!-- SEARCH BAR -->
        <div class="flex items-center w-full max-w-xl mx-4">
            <div class="flex w-full items-center bg-[#121212] border border-[#303030] rounded-full overflow-hidden focus-within:border-blue-500">
                <input id="searchInput" type="text" placeholder="Tìm kiếm tên video hoặc dán link YouTube..." 
                       class="w-full bg-transparent px-4 py-2 text-sm text-white focus:outline-none"
                       onkeypress="if(event.key === 'Enter') handleSearch()">
                <button onclick="handleSearch()" class="bg-[#222222] hover:bg-[#303030] px-5 py-2 border-l border-[#303030] text-gray-300">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <!-- CONTROLS & TABS -->
        <div class="flex items-center gap-3">
            <button onclick="switchTab('home')" id="tabHomeBtn" class="px-3 py-1.5 rounded-full text-sm font-medium bg-[#272727] text-white">Khám phá</button>
            <button onclick="switchTab('library')" id="tabLibBtn" class="px-3 py-1.5 rounded-full text-sm font-medium hover:bg-[#272727] text-gray-300">Thư viện của tôi</button>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- MAIN CONTENT VIEW -->
        <main class="flex-1 overflow-y-auto p-6">
            
            <!-- HOME VIEW -->
            <div id="homeView" class="max-w-6xl mx-auto flex flex-col gap-6">
                <!-- Video Player Container -->
                <div class="ratio-box shadow-2xl">
                    <iframe id="mainPlayer" 
                            src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1&enablejsapi=1" 
                            title="YouTube Player" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen></iframe>
                </div>

                <!-- Video Actions & Info -->
                <div class="flex flex-wrap items-center justify-between gap-4 bg-[#1f1f1f] p-4 rounded-xl border border-[#272727]">
                    <div>
                        <h1 id="currentTitle" class="text-lg font-bold text-white">Học Cùng Tôi #12 | Coding Lofi Beats</h1>
                        <p class="text-xs text-gray-400 mt-1">Phát sạch không quảng cáo • Chuẩn giao diện Premium</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="saveCurrentVideo()" class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded-full font-medium flex items-center gap-2 transition">
                            <i class="fa-solid fa-heart"></i> Lưu vào Yêu thích
                        </button>
                        <div class="flex items-center gap-2 bg-[#272727] px-3 py-2 rounded-full text-sm">
                            <span class="text-gray-300 text-xs">Tự động phát:</span>
                            <input type="checkbox" id="autoplayToggle" checked class="cursor-pointer accent-red-600">
                        </div>
                    </div>
                </div>

                <!-- Quick Themes / Recommendations -->
                <div>
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-white">
                        <i class="fa-solid fa-fire text-red-500"></i> Chủ đề phát nhanh & Gợi ý
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4" id="recommendationGrid">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </div>

            <!-- LIBRARY VIEW (Favorites & History) -->
            <div id="libraryView" class="max-w-6xl mx-auto hidden flex flex-col gap-6">
                <h2 class="text-2xl font-bold text-white">Thư viện cá nhân của bạn</h2>
                
                <div class="flex flex-col gap-4">
                    <h3 class="text-lg font-semibold text-red-500 border-b border-[#272727] pb-2">❤️ Video Yêu Thích</h3>
                    <div id="favoritesList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Populated via LocalStorage -->
                    </div>
                </div>

                <div class="flex flex-col gap-4 mt-6">
                    <h3 class="text-lg font-semibold text-blue-400 border-b border-[#272727] pb-2">🕒 Lịch Sử Xem Gần Đây</h3>
                    <div id="historyList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        <!-- Populated via LocalStorage -->
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const defaultVideos = [
            { id: 'jfKfPfyJRdk', title: 'Học Cùng Tôi #12 | Coding Lofi Beats', thumb: 'https://img.youtube.com/vi/jfKfPfyJRdk/hqdefault.jpg' },
            { id: 'SqcY0GlETPk', title: 'React Tutorial cho người mới bắt đầu', thumb: 'https://img.youtube.com/vi/SqcY0GlETPk/hqdefault.jpg' },
            { id: 'fJ9rUzIMcZQ', title: 'Daily Vlog | Một ngày làm Lập trình viên', thumb: 'https://img.youtube.com/vi/fJ9rUzIMcZQ/hqdefault.jpg' },
            { id: '4xDzrJKXOOY', title: 'Anime Beats | Nhạc anime thư giãn', thumb: 'https://img.youtube.com/vi/4xDzrJKXOOY/hqdefault.jpg' }
        ];

        let currentPlaying = defaultVideos[0];

        // Khởi tạo giao diện
        window.onload = function() {
            renderRecommendations();
            loadDefaultVideo();
        };

        function renderRecommendations() {
            const grid = document.getElementById('recommendationGrid');
            grid.innerHTML = defaultVideos.map(v => `
                <div onclick="playVideo('${v.id}', '${v.title}')" class="bg-[#1f1f1f] rounded-xl overflow-hidden cursor-pointer hover:bg-[#2a2a2a] transition group border border-[#272727]">
                    <div class="relative aspect-video">
                        <img src="${v.thumb}" class="w-full h-full object-cover group-hover:scale-105 transition">
                    </div>
                    <div class="p-3">
                        <h4 class="text-sm font-semibold text-white line-clamp-2">${v.title}</h4>
                    </div>
                </div>
            `).join('');
        }

        function extractVideoId(urlOrId) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : urlOrId;
        }

        function playVideo(idOrUrl, title) {
            const id = extractVideoId(idOrUrl);
            const isAutoplay = document.getElementById('autoplayToggle').checked ? 1 : 0;
            
            document.getElementById('mainPlayer').src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=${isAutoplay}&enablejsapi=1`;
            document.getElementById('currentTitle').innerText = title;
            
            currentPlaying = { id, title, thumb: `https://img.youtube.com/vi/${id}/hqdefault.jpg` };
            
            // Lưu vào lịch sử LocalStorage
            saveToHistory(currentPlaying);
            switchTab('home');
        }

        function loadDefaultVideo() {
            playVideo(defaultVideos[0].id, defaultVideos[0].title);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(query) {
                playVideo(query, `Kết quả cho: ${query}`);
            }
        }

        // Quản lý LocalStorage (Favorites & History)
        function saveToHistory(video) {
            let history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            history = history.filter(v => v.id !== video.id);
            history.unshift(video);
            if(history.length > 20) history.pop();
            localStorage.setItem('yt_history', JSON.stringify(history));
        }

        function saveCurrentVideo() {
            let favorites = JSON.parse(localStorage.getItem('yt_favorites') || '[]');
            if(!favorites.some(v => v.id === currentPlaying.id)) {
                favorites.unshift(currentPlaying);
                localStorage.setItem('yt_favorites', JSON.stringify(favorites));
                alert('Đã thêm vào danh sách Yêu thích!');
            } else {
                alert('Video này đã có trong danh sách Yêu thích của bạn.');
            }
        }

        function switchTab(tab) {
            const homeView = document.getElementById('homeView');
            const libraryView = document.getElementById('libraryView');
            const tabHomeBtn = document.getElementById('tabHomeBtn');
            const tabLibBtn = document.getElementById('tabLibBtn');

            if(tab === 'home') {
                homeView.classList.remove('hidden');
                libraryView.classList.add('hidden');
                tabHomeBtn.className = "px-3 py-1.5 rounded-full text-sm font-medium bg-[#272727] text-white";
                tabLibBtn.className = "px-3 py-1.5 rounded-full text-sm font-medium hover:bg-[#272727] text-gray-300";
            } else {
                homeView.classList.add('hidden');
                libraryView.classList.remove('hidden');
                tabLibBtn.className = "px-3 py-1.5 rounded-full text-sm font-medium bg-[#272727] text-white";
                tabHomeBtn.className = "px-3 py-1.5 rounded-full text-sm font-medium hover:bg-[#272727] text-gray-300";
                renderLibrary();
            }
        }

        function renderLibrary() {
            const favorites = JSON.parse(localStorage.getItem('yt_favorites') || '[]');
            const history = JSON.parse(localStorage.getItem('yt_history') || '[]');

            document.getElementById('favoritesList').innerHTML = favorites.length ? favorites.map(v => `
                <div onclick="playVideo('${v.id}', '${v.title}')" class="bg-[#1f1f1f] rounded-xl overflow-hidden cursor-pointer hover:bg-[#2a2a2a] transition border border-[#272727] p-2 flex gap-3">
                    <img src="${v.thumb}" class="w-28 h-16 object-cover rounded-lg">
                    <div class="flex flex-col justify-center">
                        <h4 class="text-sm font-semibold text-white line-clamp-2">${v.title}</h4>
                    </div>
                </div>
            `).join('') : '<p class="text-gray-500 text-sm">Chưa có video yêu thích nào.</p>';

            document.getElementById('historyList').innerHTML = history.length ? history.map(v => `
                <div onclick="playVideo('${v.id}', '${v.title}')" class="bg-[#1f1f1f] rounded-xl overflow-hidden cursor-pointer hover:bg-[#2a2a2a] transition border border-[#272727] p-2 flex gap-3">
                    <img src="${v.thumb}" class="w-28 h-16 object-cover rounded-lg">
                    <div class="flex flex-col justify-center">
                        <h4 class="text-sm font-semibold text-white line-clamp-2">${v.title}</h4>
                    </div>
                </div>
            `).join('') : '<p class="text-gray-500 text-sm">Chưa có lịch sử xem.</p>';
        }
    </script>
</body>
</html>
